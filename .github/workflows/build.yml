name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # 1. Configura o Python nativo
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Instala apenas as dependências do sistema que o Buildozer precisa
      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      # 3. Instala o Buildozer e o Cython diretamente no Python
      - name: Instalar Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      # 4. Roda o Buildozer nativamente (o comando 'yes' confirma os termos do Android automaticamente)
      - name: Compilar o APK com Buildozer
        run: |
          yes | buildozer android debug

      # 5. Salva o APK gerado
      - name: Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: h2opro-apk
          path: bin/*.apk
