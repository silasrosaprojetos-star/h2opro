name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev file

      - name: Instalar Buildozer e Cython Estável
        run: |
          pip install --upgrade pip
          pip install buildozer virtualenv setuptools "Cython<3.0"

      - name: Cache do Buildozer
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Compilar o APK com Buildozer
        run: |
          # Desativa o pipefail para o 'yes' não causar falso positivo de erro
          set +o pipefail
          yes | buildozer android debug

      - name: Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: h2opro-apk
          path: bin/*.apk
