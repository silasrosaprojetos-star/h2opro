name: Build APK H2O Pro

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            libffi-dev libssl-dev libtool-bin autoconf automake m4 libltdl-dev
          pip install buildozer==1.5.0 cython==0.29.33

      - name: Accept Android licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | buildozer android debug 2>&1 | head -5 || true

      - name: Build APK
        run: |
          yes | buildozer android debug 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: H2OPro-APK
          path: bin/*.apk
