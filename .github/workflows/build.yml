name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Instalamos explicitamente as bibliotecas nativas do SDL2 para sanar o erro do pkg-config
      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      # Forçamos o uso do Cython da série 0.29.x para evitar a quebra de compilação da versão 3.0
      - name: Instalar Buildozer e Cython Compatível
        run: |
          pip install --upgrade pip
          pip install buildozer virtualenv setuptools Cython==0.29.36

      - name: Cache das ferramentas do Android
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # Executamos o Buildozer de forma limpa (sem travas de pipefail)
      - name: Compilar o APK com Buildozer
        run: |
          buildozer android debug

      - name: Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: h2opro-apk
          path: bin/*.apk
